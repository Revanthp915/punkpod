services:
  punkpod:
    build: .
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${PUNKPOD_PORT:-8080}:80"
  backend:
    build: ./backend
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_FILE: /app/data/punkpod.db
      PREMIUM_ENABLED: "false"
    volumes:
      - punkpod-data:/app/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  punkpod-data:
